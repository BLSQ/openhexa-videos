<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenHEXA videos</title>
  <link rel="preload" href="assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="core/css/brand.css">
</head>
<body>
  <div id="viewport"><div id="stage"></div></div>

  <audio id="audio" preload="auto"></audio>
  <div id="startOverlay"><div class="play"></div></div>
  <div id="controls">
    <button id="play" title="Play / pause (space)">▶</button>
    <input id="scrub" type="range" min="0" step="0.01" value="0">
    <span class="time" id="time">0:00</span>
    <a id="langSwitch" class="lang"></a>
  </div>
  <script>
    // Player for every video in videos/: ?video=<id>&lang=<code>[&render=1&t=12.5].
    // Reads videos/<id>/video.json, then writes the script tags in order (document.write keeps them
    // parser-blocking, so every script sees the ones before it): generated data, the video's
    // timeline scripts, the core libraries, the video's scenes, then the core stage.
    (function () {
      const q = new URLSearchParams(location.search);
      const id = q.get('video');
      if (!id) { document.write('<p style="color:#fff;font:16px sans-serif;padding:24px">Add ?video=&lt;id&gt; (a folder of videos/).</p>'); return; }
      const xhr = new XMLHttpRequest();
      xhr.open('GET', `videos/${id}/video.json`, false);
      xhr.send();
      const man = JSON.parse(xhr.responseText);
      const langs = man.langs || ['en'];
      window.VIDEO = { ...man, id, langs, dir: `videos/${id}/` };
      window.LANG = langs.includes(q.get('lang')) ? q.get('lang') : langs[0];
      document.documentElement.lang = window.LANG;
      document.title = man.title || id;
      const css = (href) => document.write(`<link rel="stylesheet" href="${href}">`);
      const js = (src) => document.write(`<script src="${src}"><\/script>`);
      (man.coreCss || []).forEach((f) => css(`core/css/${f}`));
      (man.css || []).forEach((f) => css(VIDEO.dir + f));
      const gen = (man.gen || []).map((f) => f.replace('{lang}', window.LANG));
      // Timeline entries starting with core/ come from the shared core (e.g. core/timeline-kit.js).
      [...gen, ...(man.timeline || [])].forEach((f) => js(f.startsWith('core/') ? f : VIDEO.dir + f));
      ['engine.js', 'logo-data.js', 'heroicons.js', 'ui.js', ...(man.coreJs || [])].forEach((f) => js(`core/${f}`));
      (man.scripts || []).forEach((f) => js(VIDEO.dir + f));
      js('core/stage.js');
    })();
  </script>
</body>
</html>
